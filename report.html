<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Report — Flood Help Nepal</title>
  <link rel="stylesheet" href="css/styles.css">
 </head>
<body>
  <header class="site-header">
    <h1 id="site-title"><a id="site-title-link" href="index.html">Flood Help Nepal</a></h1>
    <div class="header-right">
      <div class="lang-toggle">
        <button id="lang-en">EN</button>
        <button id="lang-np" class="active">ने</button>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="list.html">Missing List</a>
        <a href="update.html">Update Status</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="section-report">
      <h2 id="report-title">Report a Missing Person</h2>
      <form id="report-form">
        <label id="lbl-name">Name <input name="name" required></label>
        <label id="lbl-phone">Phone <input name="phone" required></label>
        <label id="lbl-address">Address <input name="address"></label>
        <label id="lbl-photo">Photo (upload from device) <input id="photo_file" name="photo_file" type="file" accept="image/*" capture></label>
        <img id="photo-preview" class="photo-preview hidden" alt="preview">
        <label id="lbl-notes">Additional info <textarea name="notes"></textarea></label>
        <input type="hidden" name="photo_b64" id="photo_b64">
        <button type="submit" id="btn-submit-report">Submit report</button>
      </form>
      <p class="note" id="report-note">Submissions are sent to your Google Form. See README for setup steps.</p>
    </section>
  </main>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none"></iframe>
  <script src="js/app.js"></script>
</body>
</html>
