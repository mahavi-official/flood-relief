<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Update Status — Flood Help Nepal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1 id="site-title"><a id="site-title-link" href="index.html">Flood Help Nepal</a></h1>
    <div class="header-right">
      <div class="lang-toggle">
        <button id="lang-en">EN</button>
        <button id="lang-np" class="active">ने</button>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="report.html">Report</a>
        <a href="list.html">Missing List</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="section-update">
      <h2 id="update-title">Found a person</h2>
      <form id="update-form">
        <label id="lbl-missing-id">Missing Person ID (optional) <input name="missing_id" placeholder="ID from listing (if any)"></label>
        <label id="lbl-found-name">Found Person Name (optional) <input name="found_name" placeholder="Name of person found"></label>
        <label id="lbl-found-phone">Found Person Phone (optional) <input name="found_phone" placeholder="Phone of found person"></label>
        <label id="lbl-found-photo">Photo (optional) <input id="found_file" name="found_file" type="file" accept="image/*" capture></label>
        <img id="found-photo-preview" class="photo-preview hidden" alt="preview">
        <label id="lbl-reporter-phone">Your phone number (required) <input name="reporter_phone" required></label>
        <label id="lbl-status">Status <select name="status" required>
          <option value="FOUND">FOUND</option>
          <option value="DEAD">DEAD</option>
          <option value="OTHER">OTHER</option>
        </select></label>
        <label id="lbl-update-notes">Notes <textarea name="update_notes"></textarea></label>
        <button type="submit" id="btn-submit-update">Report found person</button>
      </form>
      <p class="note" id="update-note">Reports will be appended to your updates sheet. See README for setup.</p>
    </section>
  </main>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none"></iframe>
  <script src="js/app.js"></script>
</body>
</html>
